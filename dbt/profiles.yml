# Credentials come from environment variables (set in docker-compose / .env).
# Run dbt with:  dbt build --profiles-dir .
women_drug_safety:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('RESEARCH_DB_HOST', 'research-db') }}"
      port: "{{ env_var('RESEARCH_DB_PORT', '5432') | int }}"
      user: "{{ env_var('RESEARCH_DB_USER') }}"
      password: "{{ env_var('RESEARCH_DB_PASSWORD') }}"
      dbname: "{{ env_var('RESEARCH_DB_NAME') }}"
      schema: public
      threads: 4
