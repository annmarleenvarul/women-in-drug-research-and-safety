version: 2

# Authoritative DDL: sql/create_raw_tables.sql; ingestion: dags/ingest_sources.py.
# ID/version conflicts are ignored; loaded_at is the original insertion time.
sources:
  - name: raw
    schema: raw
    description: Unchanged API JSON loaded into research-db by Anett's ingestion DAG.
    tables:
      - name: faers_reports
        data_tests:
          - unique_combination:
              arguments:
                columns: [report_id, report_version]
        columns:
          - name: report_id
            data_tests: [not_null]
          - name: report_version
            data_tests: [not_null]
          - name: payload
            data_tests: [not_null]
          - name: batch_id
            data_tests: [not_null]
          - name: loaded_at
            data_tests: [not_null]
      - name: ctgov_studies
        data_tests:
          - unique_combination:
              arguments:
                columns: [nct_id, source_updated_date]
        columns:
          - name: nct_id
            data_tests: [not_null]
          - name: source_updated_date
            data_tests: [not_null]
          - name: payload
            data_tests: [not_null]
          - name: batch_id
            data_tests: [not_null]
          - name: loaded_at
            data_tests: [not_null]
