name: women-drug-project

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: women-drug-airflow:local
  user: "50000:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW_CONN_WOMEN_DB: postgres://${RESEARCH_DB_USER}:${RESEARCH_DB_PASSWORD}@research-db:5432/${RESEARCH_DB_NAME}
    DBT_PROFILES_DIR: /opt/airflow/dbt
    RESEARCH_DB_HOST: research-db
    RESEARCH_DB_PORT: "5432"
    OPENFDA_API_KEY: ${OPENFDA_API_KEY}
    RESEARCH_DB_USER: ${RESEARCH_DB_USER}
    RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD}
    RESEARCH_DB_NAME: ${RESEARCH_DB_NAME}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./dbt:/opt/airflow/dbt:ro
    - dbt_target:/opt/airflow/dbt-target
    - dbt_logs:/opt/airflow/dbt-logs

services:
  research-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${RESEARCH_DB_USER}
      POSTGRES_PASSWORD: ${RESEARCH_DB_PASSWORD}
      POSTGRES_DB: ${RESEARCH_DB_NAME}
    ports:
      - "127.0.0.1:${RESEARCH_DB_PORT}:5432"
    volumes:
      - research_data:/var/lib/postgresql/data
      - ./sql/create_raw_tables.sql:/docker-entrypoint-initdb.d/01_create_raw_tables.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: elestio/pgadmin:REL-8_10
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      research-db:
        condition: service_healthy

  airflow-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/dbt-target /opt/airflow/dbt-logs
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/dags /opt/airflow/dbt-target /opt/airflow/dbt-logs
        exec runuser -u airflow -- bash -ec '
          airflow db migrate
          airflow users create \
            --username ${AIRFLOW_ADMIN_USER} \
            --password ${AIRFLOW_ADMIN_PASSWORD} \
            --firstname Anett \
            --lastname Admin \
            --role Admin \
            --email admin@example.com || true
        '
    depends_on:
      airflow-db:
        condition: service_healthy
      research-db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_WEB_PORT}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  research_data:
  pgadmin_data:
  airflow_data:
  dbt_target:
  dbt_logs:
